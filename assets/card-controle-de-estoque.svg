<svg xmlns="http://www.w3.org/2000/svg" width="420" height="190" viewBox="0 0 420 190" role="img" aria-label="controle-de-estoque">
<title>controle-de-estoque: Estoque com consistência forte sob alta concorrência: lock pessimista por produto no PostgreSQL e API REST.</title>
<defs>
  <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050807"/><stop offset="1" stop-color="#071a14"/>
  </linearGradient>
  <linearGradient id="borda" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00e57a"/><stop offset=".5" stop-color="#1e3a8a"/><stop offset="1" stop-color="#00e57a"/>
  </linearGradient>
  <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00e57a" stop-opacity="0"/><stop offset=".5" stop-color="#00e57a" stop-opacity=".14"/><stop offset="1" stop-color="#00e57a" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="c"><rect width="420" height="190" rx="16"/></clipPath>
</defs>
<style>
  .titulo { font: 700 19px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; fill: #00e57a; }
  .desc { font: 400 13.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #d1fae5; }
  .chip { font: 600 11px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #bfdbfe; }
  .selo { font: 700 11px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #00e57a; }
  .link { font: 600 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #86a397; }
  .entra { animation: entra .8s ease-out 0.35s backwards; }
  .varre { animation: varre 5s ease-in-out 0.35s infinite; }
  .contorno { stroke-dasharray: 60 22; animation: corre 6s linear infinite; }
  .pisca { animation: pisca 1.6s ease-in-out infinite; }
  @keyframes entra { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes varre { 0% { transform: translateX(-420px); } 60%, 100% { transform: translateX(420px); } }
  @keyframes corre { to { stroke-dashoffset: -164; } }
  @keyframes pisca { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
</style>
<g clip-path="url(#c)">
  <rect width="420" height="190" fill="url(#fundo)"/>
  <rect class="varre" width="420" height="190" fill="url(#brilho)"/>
  <rect x="0" y="0" width="5" height="190" fill="#00e57a" opacity=".85"/>
</g>
<rect class="contorno" x="1" y="1" width="418" height="188" rx="15" fill="none" stroke="url(#borda)" stroke-width="1.5" opacity=".55"/>
<g class="entra">
  <circle class="pisca" cx="30" cy="34" r="4" fill="#00e57a"/>
  <text x="44" y="40" class="titulo">controle-de-estoque</text>
  <rect x="312" y="22" width="88" height="22" rx="11" fill="#064e3b" stroke="#10b981"/><text x="356.0" y="37" text-anchor="middle" class="selo">182 testes</text>
  <text x="24" y="78" class="desc">Estoque com consistência forte sob alta concorrência:</text><text x="24" y="98" class="desc">lock pessimista por produto no PostgreSQL e API REST.</text>
  <rect x="24" y="150" width="63" height="22" rx="11" fill="#0b1f3a" stroke="#1e3a8a"/><text x="55.5" y="165" text-anchor="middle" class="chip">FastAPI</text><rect x="95" y="150" width="84" height="22" rx="11" fill="#0b1f3a" stroke="#1e3a8a"/><text x="137.0" y="165" text-anchor="middle" class="chip">PostgreSQL</text><rect x="187" y="150" width="56" height="22" rx="11" fill="#0b1f3a" stroke="#1e3a8a"/><text x="215.0" y="165" text-anchor="middle" class="chip">Docker</text>
  <text x="396" y="166" text-anchor="end" class="link">ver repositório →</text>
</g>
</svg>